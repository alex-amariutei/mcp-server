spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        name: mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        type: SYNC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://aletheia.us.auth0.com/

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: MCP_SERVER_SESSIONID

logging:
  level:
    org.springframework.security: INFO
