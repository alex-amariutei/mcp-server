spring:
  application:
    name: mcp-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mcp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  ai:
    mcp:
      server:
        name: mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        type: SYNC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://aletheia.us.auth0.com/

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: MCP_SERVER_SESSIONID

logging:
  level:
    org.springframework.security: INFO
